# --------------------------------------------------------------------------
#  GSW Smart Hot Water — Κάρτα 12: Conditional «Αντίστροφη μέτρηση» (απλή)
#
#  Εμφανίζεται ΜΟΝΟ όταν θερμαίνει/κάνει boost/defrost και δείχνει mm:ss
#  που μετρά αντίστροφα, με το σωστό label ανά κατάσταση.
#  Ίδια λογική με την 11, πιο λιτή.
#
#  ΠΡΟΫΠΟΘΕΣΗ: «Time left minutes» -> input_number.gsw_time_left_minutes.
# --------------------------------------------------------------------------
type: conditional
conditions:
  - condition: state
    entity: input_select.gsw_hotwater_status
    state:
      - Heating
      - Boost
      - Defrost
card:
  type: markdown
  content: |
    {% set st = states('input_select.gsw_hotwater_status') %}
    {% set left = states('input_number.gsw_time_left_minutes') | float(0) %}
    {% set on = states('input_datetime.water_heater_on') %}
    {% if on not in ['unknown', 'unavailable', ''] %}
      {% set secs = [left * 60 - (now().timestamp() - as_timestamp(on)), 0] | max %}
    {% else %}
      {% set secs = left * 60 %}
    {% endif %}
    {% set label = {'Heating': '🔥 Θέρμανση', 'Boost': '⚡ Boost', 'Defrost': '❄️ Defrost'}.get(st, st) %}
    ## {{ label }}
    **Απομένουν:** {{ '%02d' | format((secs // 60) | int) }}:{{ '%02d' | format((secs % 60) | int) }}
    **Χρόνος %:** {{ states('input_number.gsw_time_left_pct') }} %
