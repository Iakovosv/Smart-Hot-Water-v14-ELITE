# --------------------------------------------------------------------------
#  GSW Smart Hot Water — Κάρτα 13: Conditional «Μπάρα υπολοίπου χρόνου»
#
#  Εμφανίζεται ΜΟΝΟ όταν θερμαίνει/κάνει boost/defrost.
#  Δείχνει μπάρα που ΓΕΜΙΖΕΙ ΑΝΑΠΟΔΑ (γεμίζει όσο περνά ο χρόνος) και
#  μεγάλο νούμερο mm:ss. Χρησιμοποιεί το gsw_time_left_pct.
#
#  ΠΡΟΫΠΟΘΕΣΗ: «Time left minutes» + «Time left percent» του blueprint.
# --------------------------------------------------------------------------
type: conditional
conditions:
  - condition: state
    entity: input_select.gsw_hotwater_status
    state:
      - Heating
      - Boost
      - Defrost
card:
  type: markdown
  content: |
    {% set left = states('input_number.gsw_time_left_minutes') | float(0) %}
    {% set pct = states('input_number.gsw_time_left_pct') | float(0) %}
    {% set secs = [left * 60, 0] | max %}
    {% set elapsed = 100 - pct %}
    ## ⏳ Απομένουν {{ '%02d' | format((secs // 60) | int) }}:{{ '%02d' | format((secs % 60) | int) }}
    <div style="background:var(--divider-color);border-radius:8px;height:18px;overflow:hidden;margin:10px 0">
    <div style="width:{{ elapsed }}%;height:100%;background:linear-gradient(90deg,var(--warning-color),var(--error-color))"></div>
    </div>
    **Πέρασε:** {{ elapsed }} % · **Απομένει:** {{ pct }} %
    **Νερό:** {{ states('sensor.temperature_esp_temperature_esp') | float(0) | round(1) }} °C
