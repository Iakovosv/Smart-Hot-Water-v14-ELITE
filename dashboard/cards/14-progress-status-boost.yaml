# --------------------------------------------------------------------------
#  GSW Smart Hot Water — Κάρτα 14: Progress + Status + Boost
#
#  ΙΔΙΑ δομή με την κλασική vertical-stack (gauge Progress / entities Status /
#  entities Boost) — ίδιες οντότητες, ίδιοι τίτλοι, ίδια σειρά.
#  Διακριτική ομορφιά:
#    • gauge: + unit "%" + χρώμα (κόκκινο→κίτρινο→πράσινο), ΧΩΡΙΣ βελόνα
#    • entities: + state_color (χρώμα όταν είναι on) + εικονίδια
#
#  Μόνο built-in κάρτες — χωρίς HACS, χωρίς restart (copy-paste).
# --------------------------------------------------------------------------
type: vertical-stack
cards:
  - type: gauge
    entity: input_number.gsw_hotwater_progress
    name: 🔥 Progress
    unit: "%"
    min: 0
    max: 100
    severity:
      red: 0
      yellow: 40
      green: 80

  - type: entities
    title: 🔥 Status
    show_header_toggle: false
    state_color: true
    entities:
      - entity: input_select.gsw_hotwater_status
        icon: mdi:information-outline
      - entity: switch.smart_power_outlet_1
        icon: mdi:power
      - entity: sensor.temperature_esp_temperature_esp
        icon: mdi:water-thermometer

  - type: entities
    title: ⚡ Boost
    show_header_toggle: false
    entities:
      - entity: input_select.gsw_boost_mode
        icon: mdi:cog
      - entity: input_number.gsw_boost_minutes
        icon: mdi:timer
      - entity: input_number.gsw_boost_target_temp
        icon: mdi:thermometer
      - entity: input_button.gsw_hotwater_boost
        icon: mdi:flash
