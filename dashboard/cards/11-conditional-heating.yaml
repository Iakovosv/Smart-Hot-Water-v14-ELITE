# --------------------------------------------------------------------------
#  GSW Smart Hot Water — Κάρτα 11: Conditional «Αντίστροφη μέτρηση»
#
#  Εμφανίζεται ΜΟΝΟ όταν ο θερμοσίφωνας θερμαίνει ή κάνει boost.
#  Δείχνει live αντίστροφη μέτρηση (mm:ss) που μετρά προς τα κάτω.
#
#  ΠΡΟΫΠΟΘΕΣΗ: το προαιρετικό «Time left minutes» του blueprint να δείχνει
#  στο  input_number.gsw_time_left_minutes  (αλλιώς δεν υπάρχει μέτρηση).
#
#  Πώς: το blueprint αποφασίζει τον μέγιστο χρόνο από την εξωτερική
#  θερμοκρασία (max_time_cold / max_time_warm) και γράφει κάθε 30s το
#  υπόλοιπο στο input_number. Αυτή η κάρτα διαβάζει το input_datetime
#  «τελευταία ενεργοποίηση» + το υπόλοιπο και μετρά live (mm:ss) χωρίς να
#  χρειάζεται να περιμένει το επόμενο 30s.
# --------------------------------------------------------------------------
type: conditional
conditions:
  - condition: state
    entity: input_select.gsw_hotwater_status
    state:
      - Heating
      - Boost
      - Defrost
card:
  type: markdown
  content: |
    {% set left = states('input_number.gsw_time_left_minutes') | float(0) %}
    {% set pct = states('input_number.gsw_time_left_pct') | float(0) %}
    {% set on = states('input_datetime.water_heater_on') %}
    {% if on not in ['unknown', 'unavailable', ''] %}
      {% set secs = [left * 60 - (now().timestamp() - as_timestamp(on)), 0] | max %}
    {% else %}
      {% set secs = left * 60 %}
    {% endif %}
    {% set mm = (secs // 60) | int %}
    {% set ss = (secs % 60) | int %}
    # ⏳ {{ states('input_select.gsw_hotwater_status') }}
    <div style="text-align:center">
    <span style="font-size:2.4em;font-weight:700">{{ '%02d' | format(mm) }}:{{ '%02d' | format(ss) }}</span>
    <div style="font-size:0.85em;opacity:0.7">υπόλοιπος χρόνος — μετρά αντίστροφα</div>
    </div>
    {% if pct > 0 %}
    <div style="background:var(--divider-color);border-radius:6px;height:10px;margin:8px 0">
    <div style="width:{{ pct }}%;height:100%;border-radius:6px;background:var(--primary-color)"></div>
    </div>
    {% endif %}
    **Νερό χρήσης:** {{ states('sensor.temperature_esp_temperature_esp') }} °C ·
    **Συλλέκτης:** {{ states('sensor.temperature_esp_outside_temperature') }} °C
    **Έξω:** {{ states('sensor.gw2000a_outdoor_temperature') }} °C

