blueprint:
  name: "🔥 GSW: Smart Hot Water v22 ELITE"
  description: >
    Αυτοματισμός έξυπνου θερμοσίφωνα με:
    - Έλεγχο θερμοκρασίας νερού (διακοπή όταν φτάσει στόχο)
    - Λογική Κρύο/Ήπιο κλίμα με βάση την εξωτερική θερμοκρασία
    - Μέγιστο χρόνο λειτουργίας για Κρύο και Ήπιο κλίμα (safety timer)
    - Υποστήριξη πολλαπλών χρηστών και ζωνών παρουσίας
    - Αν δεν βρίσκεται τουλάχιστον ένας χρήστης στις επιλεγμένες ζώνες, ο θερμοσίφωνας δεν ανάβει
    - Ενσωμάτωση defrost για ηλιακό με χρονικό παράθυρο λειτουργίας
    - Πολλαπλά προγράμματα ζεστού νερού με ανεξάρτητες θερμοκρασίες στόχου
    - Παράκαμψη θέρμανσης όταν το νερό είναι ήδη ζεστό
    - Παράκαμψη θέρμανσης όταν είναι ενεργό το water_temperature_check
    👨‍💻 Developer: Iakovos Venieris 📡 Project: Greece Sky and Weather ▶ https://www.youtube.com/@GreeceSkyandWeather
  domain: automation

  input:
    boiler_switch:
      name: Boiler Switch
      selector:
        entity:
          domain: switch

    water_temp_sensor:
      name: Water Temperature Sensor
      selector:
        entity:
          domain: sensor

    outdoor_temp_sensor:
      name: Outdoor Temperature Sensor
      selector:
        entity:
          domain: sensor

    solar_flag:
      name: Solar Skip Boolean
      selector:
        entity:
          domain: input_boolean

    water_temperature_check:
      name: Water Temperature Check (block heating when ON)
      selector:
        entity:
          domain: input_boolean

    user_1:
      name: User 1
      selector:
        entity:
          domain: person
    user_1_zones:
      name: User 1 Zones
      selector:
        entity:
          domain: zone
          multiple: true

    user_2:
      name: User 2 (optional)
      default: ""
      selector:
        entity:
          domain: person
    user_2_zones:
      name: User 2 Zones (optional)
      default: []
      selector:
        entity:
          domain: zone
          multiple: true

    cold_threshold:
      name: Cold Threshold (°C)
      default: 16
      selector:
        number:
          min: -5
          max: 30
          step: 1

    target_temp_cold:
      name: Target Temp Cold (°C)
      default: 55
      selector:
        number:
          min: 25
          max: 70
          step: 1

    target_temp_warm:
      name: Target Temp Warm (°C)
      default: 35
      selector:
        number:
          min: 25
          max: 70
          step: 1

    max_time_cold:
      name: Max Time Cold (minutes)
      default: 90
      selector:
        number:
          min: 10
          max: 180
          step: 5

    max_time_warm:
      name: Max Time Warm (minutes)
      default: 60
      selector:
        number:
          min: 10
          max: 180
          step: 5

    schedule_1_time:
      name: Schedule 1 Time
      default: "06:00:00"
      selector:
        time: {}
    schedule_1_temp:
      name: Schedule 1 Target Temp (0 = auto)
      default: 0
      selector:
        number:
          min: 0
          max: 70
          step: 1

    schedule_2_time:
      name: Schedule 2 Time
      default: "00:00:00"
      selector:
        time: {}
    schedule_2_temp:
      name: Schedule 2 Target Temp (0 = auto)
      default: 0
      selector:
        number:
          min: 0
          max: 70
          step: 1

    schedule_3_time:
      name: Schedule 3 Time
      default: "00:00:00"
      selector:
        time: {}
    schedule_3_temp:
      name: Schedule 3 Target Temp (0 = auto)
      default: 0
      selector:
        number:
          min: 0
          max: 70
          step: 1

    defrost_enable:
      name: Enable Defrost
      default: false
      selector:
        boolean: {}

    defrost_water_temp:
      name: Water Temp Activation (°C)
      default: 4
      selector:
        number:
          min: 0
          max: 50
          step: 1

    defrost_outdoor_temp:
      name: Outdoor Temp Activation (°C)
      default: 2
      selector:
        number:
          min: -10
          max: 20
          step: 1

    defrost_start_time:
      name: Defrost Start Time
      default: "03:00:00"
      selector:
        time: {}

    defrost_end_time:
      name: Defrost End Time
      default: "05:00:00"
      selector:
        time: {}

    defrost_check_interval:
      name: Check Interval (minutes)
      default: 5
      selector:
        number:
          min: 1
          max: 60
          step: 1

mode: restart

trigger:
  - platform: time_pattern
    minutes: "/5"

condition:
  - condition: state
    entity_id: input_boolean.gsw_smart_hotwater_enable
    state: "on"

action:
  - variables:
      # Entity ids from inputs
      water_temp_sensor_entity: !input water_temp_sensor
      outdoor_temp_sensor_entity: !input outdoor_temp_sensor
      water_temp_check_entity: !input water_temperature_check

      user_1_entity: !input user_1
      user_1_zones_list: !input user_1_zones
      user_2_entity: !input user_2
      user_2_zones_list: !input user_2_zones

      # Simple values from inputs
      cold_temp: !input target_temp_cold
      warm_temp: !input target_temp_warm
      max_cold_time: !input max_time_cold
      max_warm_time: !input max_time_warm
      cold_threshold_val: !input cold_threshold

      defrost_enabled: !input defrost_enable
      defrost_start: !input defrost_start_time
      defrost_end: !input defrost_end_time
      defrost_water: !input defrost_water_temp
      defrost_outdoor: !input defrost_outdoor_temp
      defrost_interval: !input defrost_check_interval

      schedules_times:
        - !input schedule_1_time
        - !input schedule_2_time
        - !input schedule_3_time
      schedules_temps:
        - !input schedule_1_temp
        - !input schedule_2_temp
        - !input schedule_3_temp

  # Defrost
  - choose:
      - conditions:
          - condition: template
            value_template: >
              {% if not defrost_enabled %}
                {{ false }}
              {% else %}
                {% set ns = namespace(u1_here=false, u2_here=false) %}

                {# Έλεγχος user_1 στις ζώνες του #}
                {% for z in user_1_zones_list %}
                  {% if is_state(user_1_entity, state_attr(z, 'friendly_name')) %}
                    {% set ns.u1_here = true %}
                  {% endif %}
                {% endfor %}

                {# Έλεγχος user_2 (αν έχει οριστεί) στις ζώνες του #}
                {% if user_2_entity is not string or user_2_entity != '' %}
                  {% for z in user_2_zones_list %}
                    {% if is_state(user_2_entity, state_attr(z, 'friendly_name')) %}
                      {% set ns.u2_here = true %}
                    {% endif %}
                  {% endfor %}
                {% endif %}

                {% set presence_ok = ns.u1_here or ns.u2_here %}

                {% set start = strptime(defrost_start, '%H:%M:%S').time() %}
                {% set end = strptime(defrost_end, '%H:%M:%S').time() %}
                {% set now_time = now().time() %}
                {% set w = states(water_temp_sensor_entity) | float(0) %}
                {% set o = states(outdoor_temp_sensor_entity) | float(0) %}
                {% set wt_check = is_state(water_temp_check_entity, 'on') %}

                {{ presence_ok
                   and start <= now_time <= end
                   and w <= defrost_water
                   and o <= defrost_outdoor
                   and not wt_check }}
              {% endif %}
        sequence:
          - service: switch.turn_on
            target:
              entity_id: !input boiler_switch
          - delay:
              minutes: "{{ defrost_interval }}"
          - service: switch.turn_off
            target:
              entity_id: !input boiler_switch

  # Hot water schedules
  - repeat:
      count: 3
      sequence:
        - variables:
            sched_time: "{{ schedules_times[repeat.index - 1] }}"
            sched_temp: "{{ schedules_temps[repeat.index - 1] }}"
            target_temp: >
              {% if sched_temp | float(0) > 0 %}
                {{ sched_temp }}
              {% else %}
                {% set now_out = states(outdoor_temp_sensor_entity) | float(0) %}
                {{ cold_temp if now_out < cold_threshold_val else warm_temp }}
              {% endif %}
            max_time_val: >
              {% set now_out = states(outdoor_temp_sensor_entity) | float(0) %}
              {{ max_cold_time if now_out < cold_threshold_val else max_warm_time }}

        # Έλεγχος ώρας προγράμματος
        - condition: template
          value_template: >
            {% set now_time = now().time() %}
            {% set st = strptime(sched_time, '%H:%M:%S').time() %}
            {{ st.hour == now_time.hour and st.minute == now_time.minute }}

        # Έλεγχος παρουσίας + θερμοκρασίας + water_temperature_check
        - condition: template
          value_template: >
            {% set ns = namespace(u1_here=false, u2_here=false) %}

            {# Έλεγχος user_1 στις ζώνες του #}
            {% for z in user_1_zones_list %}
              {% if is_state(user_1_entity, state_attr(z, 'friendly_name')) %}
                {% set ns.u1_here = true %}
              {% endif %}
            {% endfor %}

            {# Έλεγχος user_2 (αν έχει οριστεί) στις ζώνες του #}
            {% if user_2_entity is not string or user_2_entity != '' %}
              {% for z in user_2_zones_list %}
                {% if is_state(user_2_entity, state_attr(z, 'friendly_name')) %}
                  {% set ns.u2_here = true %}
                {% endif %}
              {% endfor %}
            {% endif %}

            {% set presence_ok = ns.u1_here or ns.u2_here %}
            {% set w = states(water_temp_sensor_entity) | float(0) %}
            {% set wt_check = is_state(water_temp_check_entity, 'on') %}

            {{ presence_ok and (w < target_temp) and not wt_check }}

        - service: switch.turn_on
          target:
            entity_id: !input boiler_switch

        - wait_template: >
            {{ states(water_temp_sensor_entity) | float(0) >= target_temp }}
          timeout:
            minutes: "{{ max_time_val }}"
          continue_on_timeout: true

        - service: switch.turn_off
          target:
            entity_id: !input boiler_switch